<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="1180" cy="-20" r="190" fill="#ff6b35" opacity="0.10"/>
  <circle cx="60" cy="430" r="140" fill="#e8472b" opacity="0.08"/>

  <image href="logo.png" x="80" y="40" width="104" height="104"/>

  <text x="80" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#2a1712">fanqie-cli</text>
  <text x="84" y="288" font-family="PingFang SC, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="28" fill="#c2410c">番茄小说的命令行</text>
  <text x="84" y="326" font-family="PingFang SC, Hiragino Sans GB, Arial Unicode MS, sans-serif" font-size="20" fill="#7a625a">搜索 · 榜单 · 目录 · 正文 · 给 Agent 和脚本用</text>

  <!-- terminal -->
  <g transform="translate(640 52)">
    <rect x="6" y="10" width="580" height="296" rx="14" fill="#2a1712" opacity="0.12"/>
    <rect width="580" height="296" rx="14" fill="#1f1512"/>
    <circle cx="26" cy="26" r="6" fill="#ff5f56"/><circle cx="46" cy="26" r="6" fill="#ffbd2e"/><circle cx="66" cy="26" r="6" fill="#27c93f"/>
    <g xml:space="preserve" font-family="Menlo, Monaco, monospace" font-size="17">
      <text x="28" y="76" fill="#ff8a5c">$ <tspan fill="#f7ebe3">fanqie rank --category 西方奇幻</tspan></text>
      <text x="28" y="116" fill="#8c7a72">- </text><text x="52" y="116" fill="#ffb18f">名次: </text><text x="112" y="116" fill="#f7ebe3">1</text>
      <text x="52" y="144" fill="#ffb18f">书名: <tspan fill="#f7ebe3">人在诡异，靠第四天灾登顶至高</tspan></text>
      <text x="52" y="172" fill="#ffb18f">作者: <tspan fill="#f7ebe3">我时糕手</tspan></text>
      <text x="52" y="200" fill="#ffb18f">字数: <tspan fill="#f7ebe3">785404</tspan></text>
      <text x="52" y="228" fill="#ffb18f">阅读量: <tspan fill="#f7ebe3">615435</tspan></text>
      <text x="28" y="268" fill="#8c7a72"># 默认类 YAML，--json 输出 JSON</text>
    </g>
  </g>
